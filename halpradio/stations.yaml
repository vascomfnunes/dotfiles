# halpradio local station catalog.
#
# Stations are grouped by listening mood; halpradio keeps this order in the
# Catalog view. IDs that match a bundled station override it, so shared
# SomaFM and Radio Paradise entries reuse the upstream catalog IDs instead of
# appearing twice.
#
# genre is a " / " separated list, country is ISO 3166-1 alpha-2,
# broadcast is FM, DAB, FM/DAB, or Online, and activities map to the app's
# activity filters (programming, cleaning, reading, thinking, relaxing, news).

